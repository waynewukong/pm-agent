<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238"/>
    </marker>
    <marker id="arrowLight" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5c6f7a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.23"/>
    </filter>
    <style>
      .bg { fill: #f7f8fa; }
      .title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 92px; font-weight: 800; letter-spacing: 0; }
      .redTitle { fill: #b2292d; }
      .label { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; font-weight: 700; fill: #111820; }
      .small { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 20px; fill: #1d2a33; }
      .tiny { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #263238; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 17px; fill: #27343b; }
      .line { stroke: #263238; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .lineLight { stroke: #5c6f7a; stroke-width: 2; fill: none; marker-end: url(#arrowLight); }
      .dash { stroke: #b9c3c9; stroke-width: 2; stroke-dasharray: 8 10; }
      .return { stroke: #5d6a73; stroke-width: 2; stroke-dasharray: 4 7; fill: none; marker-end: url(#arrowLight); }
      .activation { stroke: #1a2a33; stroke-width: 2.5; filter: url(#shadow); }
      .frame { fill: rgba(218, 245, 255, 0.28); stroke: #8ec7da; stroke-width: 3; filter: url(#shadow); }
      .framePink { fill: rgba(255, 230, 232, 0.58); stroke: #8ec7da; stroke-width: 3; }
      .frameMint { fill: rgba(222, 250, 240, 0.58); stroke: #8ec7da; stroke-width: 3; }
      .tag { fill: #f8fbfd; stroke: #8ec7da; stroke-width: 3; }
      .note { fill: #ffffff; stroke: #c7d2d8; stroke-width: 2; rx: 8; filter: url(#shadow); }
    </style>
  </defs>

